server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-kitchen
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # MySQL 配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/smart_kitchen?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PWD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 10000ms

  # RabbitMQ 配置
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:guest}
    password: ${MQ_PWD:}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.smartkitchen.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 业务自定义配置
smart-kitchen:
  order:
    pay-timeout-ms: ${ORDER_PAY_TIMEOUT_MS:900000} # 先付后做：下单后支付窗口 15 分钟（MQ x-delay 与扫表口径一致）
    timeout-scan-ms: ${ORDER_TIMEOUT_SCAN_MS:120000} # 未支付超时单扫表兜底间隔，默认 2 分钟
    timeout-scan-enabled: ${ORDER_TIMEOUT_SCAN_ENABLED:true} # 测试 profile 关闭
  jwt:
    secret: ${JWT_SECRET:}
    access-expiration: ${JWT_ACCESS_EXPIRATION:7200000} # Access Token 2 hours
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # Refresh Token 7 days
  python-service:
    url: ${PYTHON_API_URL:http://localhost:8000}
    # 服务间内部 token：与 Python 侧 AI_INTERNAL_TOKEN 配对；
    # 配置后 Java→Python 请求统一带 Bearer，且 /api/proxy/** 强制校验该 token；留空不校验便于本地联调
    internal-token: ${AI_INTERNAL_TOKEN:}
  wechat:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: ${OSS_BUCKET:}
