server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-kitchen
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # MySQL 配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/smart_kitchen?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PWD:1234}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:123456}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 10000ms

  # RabbitMQ 配置
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:guest}
    password: ${MQ_PWD:guest}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.smartkitchen.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 业务自定义配置
smart-kitchen:
  jwt:
    secret: ${JWT_SECRET:smartKitchenSecretKeyPleaseChangeInProdEnv}
    access-expiration: ${JWT_ACCESS_EXPIRATION:7200000} # Access Token 2 hours
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # Refresh Token 7 days
  python-service:
    url: ${PYTHON_API_URL:http://localhost:8000}
  wechat:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: ${OSS_BUCKET:}
